[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrahuman-dashboard"
version = "1.1.0"
description = "Privacy-first web dashboard for visualising and exporting Ultrahuman Ring health data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Haresh Suppiah", email = "h.suppiah@latrobe.edu.au"},
    {name = "Matthew Driller"},
]
keywords = ["ultrahuman", "health", "sleep", "wearable", "dashboard", "HRV"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/hareshsuppiah/ultrahuman_dashboard"
Repository = "https://github.com/hareshsuppiah/ultrahuman_dashboard"
Issues = "https://github.com/hareshsuppiah/ultrahuman_dashboard/issues"

[project.scripts]
ultrahuman-dashboard = "src.main:run"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["static/**/*"]
